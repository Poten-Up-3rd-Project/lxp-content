spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:mysql://lxp-mysql:3306/lxp_content_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

services:
  user:
    url: http://lxp-user:8080

passport:
  key:
    secret-key: ${PASSPORT_SECRET:default-secret-key-for-testing-minimum-32chars}
  filter:
    exclude-paths:
      - /health
      - /actuator/**
      - /internal/api-v1/**

storage:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET}
    endpoint: ${R2_ENDPOINT}
    region: ${R2_REGION}
    default-ttl-seconds: ${R2_DEFAULT_TTL_SECONDS}
